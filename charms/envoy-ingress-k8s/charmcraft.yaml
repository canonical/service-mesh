name: envoy-ingress-k8s
type: charm
title: Envoy Gateway Ingress
summary: A Juju charm to manage Envoy Gateway ingress resources
description: |
  envoy-ingress-k8s manages user-facing Gateway API resources (Gateway,
  HTTPRoute, SecurityPolicy) for an Envoy Gateway control plane deployed by
  envoy-controller-k8s. It provides ingress to related charms and configures
  TLS and external authentication on the gateway.

links:
  source: https://github.com/canonical/service-mesh
  issues: https://github.com/canonical/service-mesh/issues

assumes:
  - k8s-api
  - juju >= 3.6

platforms:
  ubuntu@26.04:amd64:

config:
  options:
    external_hostname:
      type: string
      description: |
        The DNS name the gateway is reached by. If unspecified, the gateway's
        load-balancer address is used. Must be a bare hostname: no scheme
        prefix and no port (e.g. "foo.example.com").

    additional-hostnames:
      type: string
      default: ""
      description: |
        Extra DNS names (comma separated) served by the gateway. They are added to
        the certificate SANs and the HTTPS listener stops filtering on
        external_hostname so host-based routes can share one gateway.
    allowed-cidrs:
      type: string
      default: ""
      description: |
        Comma separated client IPs/CIDRs allowed to reach the gateway (HTTP, HTTPS
        and TCP/TLS routes). Everything else is denied. Empty means no restriction.
        Relies on the proxy preserving client IPs (controller option
        proxy-external-traffic-policy=Local). UDP routes are not covered by Envoy
        Gateway authorization; restrict those at the network layer.
    external-ips:
      type: string
      default: ""
      description: |
        Comma separated IP addresses requested for the gateway Service
        (Gateway.spec.addresses), e.g. a floating or anchor IP on bare metal.
    http3:
      type: boolean
      default: false
      description: |
        Advertise and serve HTTP/3 (QUIC, UDP 443) on the HTTPS listener.
        Requires a certificates relation.
    tls-secret-name:
      type: string
      default: ""
      description: |
        Name of an existing kubernetes.io/tls Secret in the charm's namespace to
        serve on the HTTPS and TLS listeners instead of a certificate from the
        certificates relation. The operator owns its lifecycle (e.g. certbot or
        cert-manager renewal); the charm never writes or deletes it.
    extra-routes:
      type: string
      default: ""
      description: |
        JSON list of additional routes. Each entry has name, service, namespace,
        service_port and protocol (http, tcp, tls-terminate or udp). http entries
        take hostnames, path_prefix and strip_prefix; the others require a
        listener port. tls-terminate terminates TLS at the gateway with the
        related certificate and forwards plain TCP (e.g. MQTTS on 8883).
        Example: [{"name":"mqtts","protocol":"tls-terminate","port":8883,
        "service":"emqx","namespace":"core","service_port":1883}]

provides:
  ingress:
    interface: ingress
    optional: true
    description: |
      Provides ingress routing to a related application by creating an HTTPRoute
      through the Gateway. If two requirers ask for the same path, no route is
      created and the charm goes into a blocked state.
  gateway-metadata:
    interface: gateway_metadata
    optional: true
    description: |
      Publishes Gateway info (name, namespace, listener addresses, ports) for
      downstream consumers.

requires:
  certificates:
    interface: tls-certificates
    optional: true
    limit: 1
    description: |
      TLS certificates for the Gateway HTTPS listeners.
  forward-auth:
    interface: forward_auth
    optional: true
    limit: 1
    description: |
      Connects to an external auth provider; configures a SecurityPolicy with
      extAuth pointing at the related auth provider.

parts:
  charm:
    source: .
    plugin: uv
    build-snaps: [astral-uv]
    build-packages: [git]
