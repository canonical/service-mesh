[tox]
no_package = True
skip_missing_interpreters = True
envlist = lint, static, unit
min_version = 4.0.0

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}
uv_flags = --frozen --isolated --extra=dev

[testenv]
allowlist_externals = uv
basepython = python3
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS

[testenv:lock]
description = Update uv.lock with the latest deps
commands =
    uv lock --upgrade --no-cache

[testenv:format]
description = Apply coding style standards to code
commands =
    uv run {[vars]uv_flags} ruff format {[vars]all_path}
    uv run {[vars]uv_flags} ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
commands =
    uv run {[vars]uv_flags} codespell {tox_root}
    uv run {[vars]uv_flags} ruff check {[vars]all_path}
    uv run {[vars]uv_flags} ruff format --check --diff {[vars]all_path}

[testenv:static]
skip_install = True
description = Run static analysis checks
commands =
    uv run {[vars]uv_flags} pyright {posargs}

[testenv:unit]
description = Run unit tests
commands =
    uv run {[vars]uv_flags} coverage run --source={[vars]src_path} -m pytest \
        -v \
        -s \
        --tb native \
        {[vars]tests_path}/unit \
        {posargs}
    uv run {[vars]uv_flags} coverage report

[testenv:integration]
description = Run integration tests
pass_env =
    # The integration tests pack the charm with `charmcraft pack`. Set CHARM_PATH to a
    # pre-packed .charm file to skip packing the tailscale-config charm and deploy it instead.
    CHARM_PATH
    # Real Tailscale root OAuth client credentials. When both are set, the credential-flow
    # test runs against the live Tailscale API; otherwise that test is skipped.
    TAILSCALE_CLIENT_ID
    TAILSCALE_CLIENT_SECRET
commands =
    uv run {[vars]uv_flags} pytest \
        -v \
        -s \
        --tb native \
        --log-cli-level=INFO \
        {[vars]tests_path}/integration \
        {posargs}

[testenv:check]
skip_install = True
depends =
    lint
    static
