<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100px"
   height="100px"
   viewBox="0 0 100 100"
   version="1.1"
   id="tailscale-icon"
   xmlns="http://www.w3.org/2000/svg">
  <title>Tailscale</title>
  <g id="dots">
    <!-- Corner dots (muted) -->
    <circle cx="25" cy="25" r="11" fill="#B3B3B3" />
    <circle cx="75" cy="25" r="11" fill="#B3B3B3" />
    <circle cx="25" cy="75" r="11" fill="#B3B3B3" />
    <circle cx="75" cy="75" r="11" fill="#B3B3B3" />
    <!-- Central plus dots (solid) -->
    <circle cx="50" cy="25" r="11" fill="#1D1D1D" />
    <circle cx="25" cy="50" r="11" fill="#1D1D1D" />
    <circle cx="50" cy="50" r="11" fill="#1D1D1D" />
    <circle cx="75" cy="50" r="11" fill="#1D1D1D" />
    <circle cx="50" cy="75" r="11" fill="#1D1D1D" />
  </g>
</svg>
