name: "Rocks: Update"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

jobs:
  update:
    name: Update (${{ matrix.rock-path }})
    strategy:
      matrix:
        # The upstream project for each rock is set via 'source_repo' in the rock's
        # local justfile, so it is not passed to the reusable workflow.
        rock-path:
          - rocks/istio-pilot-rock
          - rocks/istio-ztunnel-rock
          - rocks/istio-install-cni-rock
          - rocks/kiali-rock
      fail-fast: false
    uses: canonical/observability/.github/workflows/rock-update.yaml@v2
    with:
      rock-path: ${{ matrix.rock-path }}
    secrets: inherit
