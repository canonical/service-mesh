name: "Tests: Pull Request"

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'tox.ini'
      - 'uv.lock'
      - '.github/workflows/tests-pull-request.yaml'
      - '.github/workflows/tests-istio.yaml'
      - '.github/workflows/tests-tailscale.yaml'
      - '.github/actions/setup-env/**'
      - 'charms/tailscale-*/**'
      - 'charms/bookinfo-*/terraform/**'
      - 'canonical_service_mesh/src/canonical_service_mesh/interfaces/tailscale_credentials/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      istio: ${{ steps.filter.outputs.istio }}
      tailscale: ${{ steps.filter.outputs.tailscale }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # dorny/paths-filter sets steps.filter.outputs.<name> to 'true' when any
            # path listed under that filter changes, which gates the istio job below.
            istio:
              - 'tests/integration/istio/**'
              - 'tests/integration/helpers.py'
              - 'tests/integration/__init__.py'
              - 'tests/__init__.py'
              - 'tests/pyproject.toml'
              - 'tests/tox.ini'
              - 'tests/uv.lock'
              - '.github/actions/setup-env/**'
              - '.github/workflows/tests-istio.yaml'
              - '.github/workflows/tests-pull-request.yaml'
            tailscale:
              - 'tests/integration/tailscale/**'
              - 'tests/integration/helpers.py'
              - 'tests/pyproject.toml'
              - 'tests/tox.ini'
              - 'tests/uv.lock'
              - 'charms/tailscale-*/**'
              - 'charms/bookinfo-*/terraform/**'
              - 'canonical_service_mesh/src/canonical_service_mesh/interfaces/tailscale_credentials/**'
              - '.github/actions/setup-env/**'
              - '.github/workflows/tests-tailscale.yaml'
              - '.github/workflows/tests-pull-request.yaml'

  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        run: |
          cd tests
          sudo snap install astral-uv --classic
          uvx tox -e lint

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static analysis
        run: |
          cd tests
          sudo snap install astral-uv --classic
          uvx tox -e static

  istio:
    name: Istio
    needs: [linting, static-analysis, changes]
    if: needs.changes.outputs.istio == 'true'
    uses: ./.github/workflows/tests-istio.yaml
    with:
      istio-channel: "dev/edge"
      k8s-distributions: '["canonical-k8s"]'

  tailscale-offline:
    name: Tailscale offline checks
    needs: changes
    if: needs.changes.outputs.tailscale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo snap install astral-uv --classic
          sudo snap install opentofu --classic
      - name: Check scenarios and Terraform
        working-directory: tests
        run: uvx tox -e tailscale-collect,tailscale-terraform

  tailscale:
    name: Tailscale
    needs: [linting, static-analysis, tailscale-offline, changes]
    if: >-
      needs.changes.outputs.tailscale == 'true' &&
      vars.RUN_TAILSCALE_SOLUTION_TESTS == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/tests-tailscale.yaml
    with:
      tailscale-channel: "dev/edge"
      k8s-distributions: '["canonical-k8s"]'
