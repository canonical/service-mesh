name: "Charms: Release"

on:
  workflow_dispatch:
    inputs:
      charm:
        type: choice
        description: Which charm to release
        options:
          - all
          - envoy-ai-controller-k8s
          - envoy-controller-k8s
          - envoy-ingress-k8s
  push:
    branches:
      - main
      - 'track/**'
    paths:
      - 'charms/**'

jobs:
  set-charms:
    name: Set charm matrix
    runs-on: ubuntu-latest
    outputs:
      charms: ${{ steps.set-charms.outputs.charms }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: charms
          sparse-checkout-cone-mode: true
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            envoy-ai-controller-k8s: charms/envoy-ai-controller-k8s/**
            envoy-controller-k8s: charms/envoy-controller-k8s/**
            envoy-ingress-k8s: charms/envoy-ingress-k8s/**
      - name: Set charms matrix
        id: set-charms
        run: |
          # Explicit per-charm track mapping.
          track_for() {
            case "$1" in
              envoy-ai-controller-k8s)
                echo "0.6"
                ;;
              envoy-controller-k8s)
                echo "1.7"
                ;;
              envoy-ingress-k8s)
                echo "1.7"
                ;;
              *)
                echo "Unknown charm: $1" >&2
                exit 1
                ;;
            esac
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.charm }}" != "all" ]]; then
            # Manual dispatch of a single charm: release only that charm.
            track="$(track_for "${{ inputs.charm }}")"
            echo "charms=[{\"charm-path\": \"charms/${{ inputs.charm }}\", \"charm-name\": \"${{ inputs.charm }}\", \"track\": \"${track}\"}]" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual dispatch of 'all': release every Envoy charm.
            charms='[]'
            for charm in envoy-ai-controller-k8s envoy-controller-k8s envoy-ingress-k8s; do
              track="$(track_for "${charm}")"
              charms="$(echo "${charms}" | jq -c --arg charm "${charm}" --arg track "${track}" \
                '. += [{"charm-path": ("charms/" + $charm), "charm-name": $charm, "track": $track}]')"
            done
            echo "charms=${charms}" >> "$GITHUB_OUTPUT"
          else
            # Push: release only the charms that changed.
            charms='[]'
            for charm in $(echo '${{ steps.changes.outputs.changes }}' | jq -r '.[]'); do
              track="$(track_for "${charm}")"
              charms="$(echo "${charms}" | jq -c --arg charm "${charm}" --arg track "${track}" \
                '. += [{"charm-path": ("charms/" + $charm), "charm-name": $charm, "track": $track}]')"
            done
            echo "charms=${charms}" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release (${{ matrix.charm-path }})
    needs: set-charms
    if: ${{ needs.set-charms.outputs.charms != '' && needs.set-charms.outputs.charms != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.set-charms.outputs.charms) }}
      fail-fast: false
    permissions:
      actions: read
      security-events: write
      contents: write
    uses: canonical/observability/.github/workflows/charm-release.yaml@v2
    secrets: inherit
    with:
      charm-path: ${{ matrix.charm-path }}
      git-tag-prefix: ${{ matrix.charm-name }}
      track: ${{ matrix.track }}
      provider: ${{ matrix.charm-path == 'charms/tailscale-beacon' && 'machine' || 'k8s' }}
