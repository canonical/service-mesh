name: "Charms: Release"

on:
  workflow_dispatch:
    inputs:
      charm:
        type: choice
        description: Which charm to release
        options:
          - all
          - envoy-ai-controller-k8s
          - envoy-controller-k8s
          - envoy-ingress-k8s
          - istio-beacon-k8s
          - istio-ingress-k8s
          - istio-k8s
          - tailscale-beacon
          - tailscale-beacon-k8s
          - tailscale-config
          - tailscale-k8s
  push:
    branches:
      - main
      - 'track/**'
    paths:
      - 'charms/envoy-ai-controller-k8s/**'
      - 'charms/envoy-controller-k8s/**'
      - 'charms/envoy-ingress-k8s/**'
      - 'charms/istio-beacon-k8s/**'
      - 'charms/istio-ingress-k8s/**'
      - 'charms/istio-k8s/**'
      - 'charms/tailscale-beacon/**'
      - 'charms/tailscale-beacon-k8s/**'
      - 'charms/tailscale-config/**'
      - 'charms/tailscale-k8s/**'

jobs:
  set-charms:
    name: Set charm matrix
    runs-on: ubuntu-latest
    outputs:
      charms: ${{ steps.set-charms.outputs.charms }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            manifest.yaml
            scripts
            charms
          sparse-checkout-cone-mode: true
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            envoy-ai-controller-k8s: charms/envoy-ai-controller-k8s/**
            envoy-controller-k8s: charms/envoy-controller-k8s/**
            envoy-ingress-k8s: charms/envoy-ingress-k8s/**
            istio-beacon-k8s: charms/istio-beacon-k8s/**
            istio-ingress-k8s: charms/istio-ingress-k8s/**
            istio-k8s: charms/istio-k8s/**
            tailscale-beacon: charms/tailscale-beacon/**
            tailscale-beacon-k8s: charms/tailscale-beacon-k8s/**
            tailscale-config: charms/tailscale-config/**
            tailscale-k8s: charms/tailscale-k8s/**
      - name: Set charms matrix
        id: set-charms
        run: |
          # Single source of truth: manifest.yaml maps each charm to the Charmhub
          # track it releases to from this branch. Explicit tracks are mandatory:
          # the branch name (track/26.10) would otherwise infer 26.10/edge.
          branch="${{ github.ref_name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.charm }}" != "all" ]]; then
            # Manual dispatch of a single charm: release only that charm.
            selected="$(python3 scripts/manifest.py charms "${branch}" --only "${{ inputs.charm }}")"
            if [[ "${selected}" == "[]" ]]; then
              echo "::error::No release for charm '${{ inputs.charm }}' on branch '${branch}' in manifest.yaml"
              exit 1
            fi
            echo "charms=${selected}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual dispatch of 'all': release every charm on this branch.
            echo "charms=$(python3 scripts/manifest.py charms "${branch}")" >> "$GITHUB_OUTPUT"
          else
            # Push: release only the charms that changed.
            changes='${{ steps.changes.outputs.changes }}'
            echo "charms=$(python3 scripts/manifest.py charms "${branch}" --only "${changes}")" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release (${{ matrix.charm-path }})
    needs: set-charms
    if: ${{ needs.set-charms.outputs.charms != '' && needs.set-charms.outputs.charms != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.set-charms.outputs.charms) }}
      fail-fast: false
    permissions:
      actions: read
      security-events: write
      contents: write
    uses: canonical/observability/.github/workflows/charm-release.yaml@v2
    secrets: inherit
    with:
      charm-path: ${{ matrix.charm-path }}
      git-tag-prefix: ${{ matrix.charm-name }}
      track: ${{ matrix.track }}
      terraform-tag-prefix: ${{ matrix.terraform-tag-prefix || 'tf-' }}
      provider: ${{ matrix.charm-path == 'charms/tailscale-beacon' && 'machine' || 'k8s' }}
